<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penpal - Read Letter</title>
    
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #fcd0df;
            height: 100vh;
            font-family: 'DynaPuff', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            caret-color: transparent;
            overflow: hidden;
        }

        .top-nav {
            display: flex;
            justify-content: flex-start;
            padding: 15px 30px;
            z-index: 10;
        }

        .nav-icon { font-size: 2rem; color: #4a2c2a; cursor: pointer; }

        .desk-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 10px 40px;
            position: relative;
            min-height: 0;
        }

        .envelope-back {
            position: absolute;
            width: 620px;
            height: 420px;
            background-color: #f8e6ec;
            border: 3px solid #4a2c2a;
            transform: rotate(-3deg);
            z-index: 1;
            box-shadow: 15px 15px 0px rgba(74, 44, 42, 0.05);
        }

        /* STATIONERY CARD */
        .stationery {
            background-color: white;
            width: 480px;
            height: 85%;
            max-height: 580px;
            padding: 30px 40px 70px 40px;
            box-shadow: 10px 10px 0px rgba(74, 44, 42, 0.05);
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
        }

        /* SCROLLABLE INCOMING TEXT AREA */
        .letter-content {
            flex-grow: 1;
            border: none;
            outline: none;
            font-family: sans-serif;
            font-size: 1.1rem;
            background: repeating-linear-gradient(white, white 30px, #f1f1f1 31px);
            line-height: 31px;
            user-select: text;
            overflow-y: auto;
            text-align: left;
            padding-right: 10px;
            padding-bottom: 60px;
            color: #4a2c2a;
        }

        .letter-content::-webkit-scrollbar { width: 8px; }
        .letter-content::-webkit-scrollbar-track { background: #f1f1f1; }
        .letter-content::-webkit-scrollbar-thumb { background: #fcd0df; border-radius: 10px; }

        /* Modified Action Button pointing to code composition views */
        .reply-btn {
            position: absolute;
            bottom: 15px;
            right: 25px;
            background-color: white;
            border: 3px solid #4a2c2a;
            border-radius: 50px;
            padding: 4px 25px;
            color: #4a2c2a;
            font-family: 'DynaPuff', sans-serif;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 20;
            text-decoration: none;
            display: inline-block;
        }

        .reply-btn:hover {
            background-color: #4a2c2a;
            color: white;
            transform: translateY(-2px);
        }

        /* MP3 PLAYER WITH CLOSED READ-ONLY CENTER CORE */
        .mp3-player { width: 200px; height: 320px; background-color: #f8e6ec; border: 4px solid #4a2c2a; border-radius: 25px; padding: 15px; transform: rotate(-10deg); z-index: 10; position: relative; display: flex; flex-direction: column; align-items: center;}
        
        .mp3-screen { 
            width: 100%; 
            height: 110px; 
            background-color: #4a2c2a;
            border: 2px solid #833b3b; 
            margin-bottom: 20px; 
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mini-track-node {
            font-family: sans-serif;
            font-size: 0.65rem;
            color: #fcd0df;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin: 0;
        }

        .mp3-wheel { width: 110px; height: 110px; background-color: white; border: 4px solid #4a2c2a; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        
        /* Changed: Removed blue color and plus cursor behaviors */
        .mp3-center-static { width: 40px; height: 40px; background-color: #4a2c2a; border-radius: 50%; border: 2px solid #4a2c2a; }
        
        .wire-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    </style>
</head>
<body>

    <div class="top-nav">
        <i class="bi bi-house-door-fill nav-icon" onclick="location.href='dashboard.html'"></i>
    </div>

    <div class="desk-container" style="justify-content: center; gap: 80px;">
        <svg class="wire-container">
            <path d="M 350 550 C 250 500, 150 350, 300 150" stroke="#4a2c2a" stroke-width="3" fill="none" />
            <path d="M 350 550 C 400 450, 200 80, 500 80" stroke="#4a2c2a" stroke-width="3" fill="none" />
        </svg>

        <div class="mp3-player">
            <div class="mp3-screen" id="mp3Display">
                <!-- <p class="mini-track-node">🎵 The Weeknd - Starboy</p> -->
                <!-- <p class="mini-track-node">🎵 Drake - One Dance</p> -->
            </div>
            <div class="mp3-wheel">
                <div class="mp3-center-static"></div>
            </div>
            <div class="mt-2" style="font-size: 0.8rem;">Playlist Pairing</div>
            <div style="width: 10px; height: 15px; background: #4a2c2a; position: absolute; bottom: -15px;"></div>
        </div>

        <div class="envelope-back" style="transform: rotate(-3deg) translateX(30px);"></div>

        <div class="stationery" style="transform: translateX(30px);">
            <div id="reader" class="letter-content" contenteditable="false">
                <!-- Dear Penpal,<br><br>
                Thank you so much for your previous letter! I really loved hearing about your city. The weather here has been a bit rainy, which makes it perfect for staying inside and typing back to you.<br><br>
                I've paired this letter with a couple of tracks I've been listening to on repeat lately. Let me know what you think of them when you write back!<br><br>
                Best wishes,<br>
                Sunny_Soul -->
            </div>
            <a href="Write.html" id="replyBtn" class="reply-btn">WRITE</a>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const id = new URLSearchParams(location.search).get('id');
            if (!id) return;
            const letter = await getLetter(id);
            if (!letter || letter.error) return;
            const reader = document.getElementById('reader');
            if (reader) reader.innerHTML = letter.body;
            const replyBtn = document.getElementById('replyBtn');
            if (replyBtn) replyBtn.href = `Write.html?to=${letter.senderId}`;
        });
    </script>
</body>
</html>
