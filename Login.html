<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penpal - Join Us</title>
    
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons Link for the Neat Home Button -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        /* FIX: Removes unprofessional blinking cursor from the page background/text */
        body {
            background-color: #fcd0df; /* Penpal Pink */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'DynaPuff', sans-serif;
            margin: 0;
            user-select: none; /* Prevents accidental text highlighting */
            caret-color: transparent; /* Hides the blinking cursor globally */
        }

        /* Re-enables the cursor ONLY for text inputs so you can still type */
        input, textarea {
            user-select: text;
            caret-color: auto; 
        }

        .auth-container {
            background-color: #f8e6ec; /* Soft Light Pink */
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(74, 44, 42, 0.1);
            position: relative; /* Needed to anchor the Home Button */
        }

        /* NEW: Neat Home Button Styling */
        .home-icon-link {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: #4a2c2a; /* Penpal Brown */
            transition: transform 0.2s, color 0.2s;
            text-decoration: none;
            line-height: 1;
        }

        .home-icon-link:hover {
            color: #fcd0df; /* Pops to pink on hover */
            transform: scale(1.1);
        }

        /* Tab Styling */
        .nav-tabs {
            border-bottom: none;
            margin-bottom: 30px;
            display: flex;
            padding-right: 40px; /* Make room so tabs don't hit the home icon */
        }

        .nav-tabs .nav-link {
            flex: 1;
            text-align: center;
            border: none;
            padding: 15px;
            color: #4a2c2a;
            background-color: rgba(255, 255, 255, 0.5);
            transition: 0.3s;
        }

        .nav-tabs .nav-link.active {
            background-color: #4a2c2a; /* Dark Penpal Brown */
            color: white;
            border-radius: 10px 10px 0 0;
        }

        /* Social Buttons */
        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-social {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            color: white;
            font-size: 1.2rem;
            transition: opacity 0.2s;
        }

        .btn-fb { 
            background-color: #3b5998; 
        }

        .btn-google { 
            background-color: #db4437; 
        }

        /* Form Controls */
        .form-control {
            background-color: rgba(255, 255, 255, 0.7);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 15px;
            font-family: sans-serif;
        }

        .form-control:focus {
            border-color: #4a2c2a;
            box-shadow: none;
            background-color: white;
        }

        .btn-auth {
            width: 100%;
            background-color: #4a2c2a;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-family: 'DynaPuff', sans-serif;
            font-size: 1.2rem;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        .btn-auth:hover {
            transform: scale(1.02);
            color: #fcd0df;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- NEAT HOME BUTTON: Replaces the drawing from WD3.jpg -->
        <a href="Penpal .html" class="home-icon-link" title="Go to Home">
            <i class="bi bi-house-heart-fill"></i>
        </a>

        <!-- Tabs to switch between Sign In and Sign Up -->
        <ul class="nav nav-tabs" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="signin-tab" data-bs-toggle="tab" data-bs-target="#signin" type="button" role="tab">SIGN IN</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup" type="button" role="tab">SIGN UP</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
            <!-- SIGN IN PANEL -->
            <div class="tab-pane fade show active" id="signin" role="tabpanel">
                <div class="social-login">
                    <button class="btn-social btn-fb">f</button>
                    <button class="btn-social btn-google">G</button>
                </div>
                <form action="/Account/Login" method="post">
                    <input type="email" name="email" class="form-control" placeholder="E-mail" required>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <button type="submit" class="btn-auth">SIGN IN</button>
                </form>
            </div>

            <!-- SIGN UP PANEL -->
            <div class="tab-pane fade" id="signup" role="tabpanel">
                <form action="/Account/Register" method="post">
                    <input type="text" name="name" class="form-control" placeholder="Username" required>
                    <input type="email" name="email" class="form-control" placeholder="E-mail" required>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <button type="submit" class="btn-auth">SIGN UP</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Required Bootstrap JS for Tab Functionality -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // Error display — reads ?error= appended by server.js Stage 1 redirects.
      // Known codes and their human-readable messages are fully mapped here.
      // The only missing piece is inserting `message` into the page — left as
      // a TODO because it requires knowing which element to target and what
      // Bootstrap/DynaPuff styling to apply (the page has no .alert yet).
      document.addEventListener('DOMContentLoaded', () => {
        const code = new URLSearchParams(location.search).get('error');
        if (!code) return;

        const messages = {
          invalid_credentials: 'Incorrect email or password. Please try again.',
          email_taken:         'An account with that email already exists. Try signing in.',
        };
        const message = messages[code] ?? 'Something went wrong. Please try again.';

        // TODO(frontend): render `message` into the page.
        // Add a <div class="alert alert-danger"> element inside .auth-container,
        // above the tab panels, using DynaPuff font and Penpal Brown text to
        // match the surrounding form.  Set its textContent to `message`.
      });
    </script>
</body>
</html>
